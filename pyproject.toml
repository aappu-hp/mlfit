[project]
name = "mlfit"
version = "0.2.0"
description = "Universal model deployment advisor — find the best way to serve any model on your hardware."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "mlfit contributors" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "huggingface-hub>=0.23",
    "psutil>=5.9",
    "py-cpuinfo>=9.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/your-org/mlfit"
Repository = "https://github.com/your-org/mlfit"

[project.optional-dependencies]
gpu = ["torch>=2.0"]
gguf = ["gguf>=0.9"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]

[project.scripts]
mlfit = "mlfit.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a real GPU"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]
